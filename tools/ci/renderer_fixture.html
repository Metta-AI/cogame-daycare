<!doctype html>
<!-- ============================================================
     Daycare worst-case RENDERER FIXTURE (design note ## Tests, item 10).

     Why this file exists: tools/ci/docker_smoke.sh runs with NO
     ANTHROPIC_API_KEY, so every seat plays a scripted baseline, a scripted
     baseline emits a short fixed `hunch` and an empty `notes`, and therefore
     EVERY REPLAY CI PRODUCES CARRIES ZERO LLM TEXT. Nothing that plays that
     replay can draw the chrome that shows LLM text -- the feed row that
     carries the hunch, the secret panel -- so the wasm-viewer job would go
     green over a layout that breaks the moment a real champion plays
     (cogchemists, 2026-08-24).

     What it measures, and why it is an IFRAME (r1 review N13 / C3): the
     SHIPPED page. It fetches client/replay_broadcast.html, splices the three
     script markers exactly as Dockerfile.replay-viewer's sed does, and loads
     the result in an iframe at 360 / 620 / 1152 CSS pixels of VIEWPORT width.
     The earlier fixture re-declared the chrome CSS inline and resized #stage
     in px, so the shipped `#care-secret` / `.feed-row` rules were never the
     ones measured and `@media (max-width: 640px)` -- which keys off the
     viewport -- could not fire at all. An iframe has its own viewport, so the
     360 px plate/subline collapse is now exercised, and the DOM assertions
     below run against the shipped boxes with a full-cap 80-rune hunch and
     240-rune notes on BOTH seats and a 15-chip guess tape in them.

     The page is driven through its own `window.CtfStaticReplay` seam -- the
     hook the static bundle uses -- so not one line of the shipped page or of
     the real client/chrome_common.js and client/broadcast_core.js is edited
     here. Board text is server-side sprite art in Daycare (see
     src/daycare/global.nim), so `canvas_text` is structurally 0 for this
     repo and the gate that matters is this fixture's own assertions: every
     one of them sets data-replay-error, which fails viewer_smoke.mjs.

     Run (it must be SERVED, not file://: the fixture fetches the shipped page):
       python3 -m http.server 8731 &
       node tools/ci/viewer_smoke.mjs \
         --url http://127.0.0.1:8731/tools/ci/renderer_fixture.html \
         --strict-text-bounds
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daycare renderer fixture</title>
<style>
  html, body { margin: 0; background: #0d150b; color: #f2e8d8;
               font: 12px ui-sans-serif, sans-serif; }
  #frame { display: block; border: 0; background: #05080a; }
  #status { padding: 5px 7px; font-family: ui-monospace, monospace;
            font-size: 11px; color: #b9c9ad; }
  #status.show { color: #e0523a; }
</style>
</head>
<body>
<iframe id="frame" width="360" height="640" title="the shipped broadcast page"></iframe>
<div id="status">fixture: loading the shipped page&hellip;</div>
<script>
(function () {
  'use strict';

  var TURNS = 15;
  var TICKS_PER_TURN = 60;
  var MAX_TICK = TURNS * TICKS_PER_TURN - 1;
  // Exactly the design note's caps, in RUNES. The fixture self-checks these AND
  // checks the strings reached the DOM: a cap change that is not mirrored here,
  // or a quietly shortened fixture string, fails the job instead of passing
  // while measuring nothing.
  var HUNCH_CAP = 80;
  var NOTES_CAP = 240;
  // The featured-match iframe is ~360 px wide; 620 is the #stage.tiny switch
  // and 1152 is the board's native width.
  var VIEWS = [[360, 640], [620, 480], [1152, 720]];

  var statusEl = document.getElementById('status');
  var frame = document.getElementById('frame');
  var done = [];

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', String(message));
    statusEl.textContent = 'fixture failed: ' + message;
    statusEl.className = 'show';
    throw new Error(message);
  }

  function need(ok, message) { if (!ok) fail(message); }

  function repeatTo(seed, runes) {
    var out = '';
    while (Array.from(out).length < runes) out += seed;
    return Array.from(out).slice(0, runes).join('');
  }
  // Multi-byte runes on purpose: the recorded strings are rune-truncated, so a
  // full-cap string is 80 RUNES and can be far more than 80 bytes.
  var HUNCH = repeatTo('it only ever reaches for bananas — ünïcödé ', HUNCH_CAP);
  var NOTES = repeatTo('turn 3 it walked over an apple twice and refused it — ünïcödé ', NOTES_CAP);
  need(Array.from(HUNCH).length === HUNCH_CAP, 'hunch fixture is not ' + HUNCH_CAP + ' runes');
  need(Array.from(NOTES).length === NOTES_CAP, 'notes fixture is not ' + NOTES_CAP + ' runes');

  // ---- a worst-case Daycare broadcast frame ----------------------------
  // The shape src/daycare/broadcast.nim emits, with the caps maxed on BOTH
  // seats. `notes` rides the order events even though the shipped page draws
  // only the hunch: the string the server can record is what a future notes
  // row would have to fit, so the fixture hands it over at full cap.
  function buildState(tick) {
    var tape = [];
    for (var i = 0; i < TURNS; i++) tape.push(i < 11 ? (i % 3 === 2 ? 0 : 1) : -1);
    var pts = [];
    for (var t = 0; t <= MAX_TICK; t += 1) {
      pts.push([t, Math.floor(t / 20), Math.floor(t / 20)]);
    }
    var events = [
      { k: 'order', t: tick, seat: 0, turn: 12, role: 'parent', job: 'provide',
        f: 'banana', guess: 'banana', source: 'llm', hunch: HUNCH, notes: NOTES },
      { k: 'order', t: tick, seat: 1, turn: 12, role: 'child', job: 'show',
        f: 'banana', source: 'llm', hunch: HUNCH, notes: NOTES },
      { k: 'eat', t: tick, seat: 1, f: 'banana', pref: true, pts: 3 },
      { k: 'reach', t: tick, seat: 1, f: 'banana', src: 'T4', kind: 'tall', n: 8 }
    ];
    return {
      ph: 'playing', t: tick, mx: MAX_TICK, st: 0, mt: MAX_TICK, sp: 1,
      pl: true, en: true, lp: false, sk: false, ff: false, lob: 0, hold: 0,
      pov: -1, mm: -1,
      turn: 12, turns: TURNS, ticksPerTurn: TICKS_PER_TURN,
      variant: 'daycare-fickle', par: 30, scores: [41, 41],
      teams: {
        parent: { lives: 41, policies: ['Parent'], flag: 'home', carrier: -1 },
        child: { lives: 41, policies: ['Child'], flag: 'home', carrier: -1 }
      },
      roster: [
        { s: 0, name: 'Alder', pol: 'daycare-attentive', team: 'parent',
          lives: 0, alive: true, carry: true, k: 0, d: 0, a: 0, pk: [] },
        { s: 1, name: 'Bramble', pol: 'daycare-provider', team: 'child',
          lives: 0, alive: true, carry: false, k: 0, d: 0, a: 0, pk: [] }
      ],
      lead: { teams: ['parent', 'child'], pts: pts },
      beats: [
        { t: 60, k: 'turn', n: 1 }, { t: 120, k: 'guess', g: 'banana', ok: true },
        { t: 300, k: 'feast', n: 3 }, { t: 420, k: 'switch', g: 'apple' },
        { t: MAX_TICK, k: 'gameover' }
      ],
      lulls: [], events: events,
      secret: { pref: 'banana', guess: 'apple', right: false, tape: tape,
                rightTurns: 7 }
    };
  }

  // ---- the shipped page, spliced exactly as the bundle splices it -------
  var PAGE = new URL('../../client/replay_broadcast.html', location.href).href;
  var BASE = new URL('../../client/', location.href).href;
  var FONT = new URL('../../data/font.ttf', location.href).href;
  // window.CTF_WIRE is nim-generated (tools/gen_wire_constants.nim) at bundle
  // time; these are the same values, and chrome_common.js reads them at its
  // line 72 exactly as it does in the bundle.
  var WIRE = { speeds: [1, 2, 3, 4, 8, 16], fps: 24, chromeSpriteId: 4090,
               shotFxTicks: 3, shotTrailFalloff: 2 };
  // The page's own adapter seam: `window.CtfStaticReplay` is how the static
  // bundle hands it a core that is fed frames instead of a websocket. The
  // fixture uses the same seam, so the page is untouched.
  var SEAM =
    'window.CtfStaticReplay = { createCore: function (cfg) {' +
    '  var opts = {}; for (var k in cfg) opts[k] = cfg[k];' +
    '  opts.websocket = false; opts.playoutBuffer = false;' +
    '  opts.devicePixelRatio = 1;' +
    '  var core = window.BroadcastCore.create(opts);' +
    '  window.__fixtureCore = core;' +
    '  return core;' +
    '} };';

  function splice(html) {
    ['<!-- WIRE_CONSTANTS -->', '<!-- CHROME_COMMON -->',
      '<!-- BROADCAST_CORE -->'].forEach(function (marker) {
      need(html.indexOf(marker) >= 0,
        'the shipped page has no ' + marker + ' splice marker');
    });
    var open = '<scr' + 'ipt>';
    var close = '</scr' + 'ipt>';
    var src = function (file) {
      return '<scr' + 'ipt src="' + file + '"></scr' + 'ipt>';
    };
    html = html
      .replace('<!-- WIRE_CONSTANTS -->',
        open + 'window.CTF_WIRE = ' + JSON.stringify(WIRE) + ';' + close)
      .replace('<!-- CHROME_COMMON -->', src('chrome_common.js'))
      .replace('<!-- BROADCAST_CORE -->',
        src('broadcast_core.js') + open + SEAM + close);
    // The bundle puts font.ttf next to index.html; in the repo it lives in
    // data/, so point that one url at it and measure the REAL font metrics.
    need(html.indexOf("url('./font.ttf')") >= 0,
      'the shipped page no longer loads ./font.ttf');
    html = html.replace("url('./font.ttf')", "url('" + FONT + "')");
    return html.replace('<head>', '<head><base href="' + BASE + '">');
  }

  // ---- the synthetic sprite packet the board compositor reads -----------
  function u16(a, v) { a.push(v & 255, (v >> 8) & 255); }
  function i16(a, v) { u16(a, v < 0 ? v + 0x10000 : v); }
  function u32(a, v) { a.push(v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255); }

  function spriteMessage(win, out, id, w, h, rgba, label) {
    out.push(0x01);
    u16(out, id); u16(out, w); u16(out, h);
    var packed = win.SnappyJS.compress(rgba);
    var bytes = packed instanceof win.Uint8Array ? packed : new win.Uint8Array(packed);
    u32(out, bytes.length);
    for (var i = 0; i < bytes.length; i++) out.push(bytes[i]);
    var enc = new TextEncoder().encode(label || '');
    u16(out, enc.length);
    for (var k = 0; k < enc.length; k++) out.push(enc[k]);
  }

  function buildPacket(win, chromeJson) {
    var out = [];
    out.push(0x06, 0, 0, 1);                       // layer 0: map, zoomable
    out.push(0x05, 0); u16(out, 1152); u16(out, 672);
    var tile = new win.Uint8Array(48 * 48 * 4);
    for (var i = 0; i < 48 * 48; i++) {
      tile[i * 4] = 104; tile[i * 4 + 1] = 158; tile[i * 4 + 2] = 74;
      tile[i * 4 + 3] = 255;
    }
    spriteMessage(win, out, 30, 48, 48, tile, 'yard band 0');
    out.push(0x02); u16(out, 40); i16(out, 0); i16(out, 0); i16(out, -32768);
    out.push(0); u16(out, 30);
    var cog = new win.Uint8Array(40 * 40 * 4);
    for (var j = 0; j < 40 * 40; j++) {
      cog[j * 4] = 74; cog[j * 4 + 1] = 122; cog[j * 4 + 2] = 214;
      cog[j * 4 + 3] = 255;
    }
    spriteMessage(win, out, 601, 40, 40, cog, 'cog_parent_front x40');
    out.push(0x02); u16(out, 400); i16(out, 560); i16(out, 380); i16(out, 40);
    out.push(0); u16(out, 601);
    // The chrome rides the LABEL of the reserved 1x1 sprite 4090 -- the binary
    // channel that survives a hosted replay.
    spriteMessage(win, out, 4090, 1, 1, new win.Uint8Array(4), chromeJson);
    return new win.Uint8Array(out);
  }

  // ---- the assertions: the SHIPPED boxes, at this viewport width --------
  function rectOf(el) { return el.getBoundingClientRect(); }

  function measure(win, doc, width) {
    var at = ' at ' + width + 'px';
    need(win.ChromeCommon, 'chrome_common.js did not load' + at);
    need(win.DaycareChrome, 'the shipped game block never wrapped ChromeCommon' + at);
    var layer = doc.getElementById('care-layer');
    var panel = doc.getElementById('care-secret');
    var feed = doc.getElementById('killfeed');
    var transport = doc.getElementById('transport');
    need(layer && panel && feed && transport, 'the shipped chrome is incomplete' + at);

    // The panel really rendered from the frame, and the tape is one chip per
    // turn -- the shipped builder's own output, not the fixture's.
    var tape = doc.getElementById('care-tape');
    need(tape.children.length === TURNS,
      'the guess tape is ' + tape.children.length + ' chips, want ' + TURNS + at);
    need(/BRAMBLE WANTS/.test(panel.textContent) &&
      /ALDER GUESSES/.test(panel.textContent) && /WRONG/.test(panel.textContent),
      'the secret panel did not render its reveal' + at);

    // The full-cap hunch reached the DOM, at full length, on both seats.
    var rows = feed.querySelectorAll('.feed-row');
    need(rows.length > 0, 'the feed drew no rows' + at);
    var withHunch = 0;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].textContent.indexOf(HUNCH) >= 0) withHunch += 1;
    }
    need(withHunch === 2,
      'the full-cap hunch reached ' + withHunch + ' feed rows, want 2 (both seats)' + at);

    // Nothing the game block draws may overflow its own box or leave the board
    // region between the scorebug band and the transport band.
    var layerBox = rectOf(layer);
    var bandTop = rectOf(transport).top;
    function fits(el, name) {
      var box = rectOf(el);
      if (box.width === 0 && box.height === 0) return;   // display:none is fine
      need(box.right <= win.innerWidth + 1 && box.left >= -1,
        name + ' crosses the viewport edge (' + Math.round(box.left) + '..' +
        Math.round(box.right) + ' of ' + win.innerWidth + ')' + at);
      need(box.top >= layerBox.top - 1 && box.bottom <= bandTop + 1,
        name + ' leaves the board region (' + Math.round(box.top) + '..' +
        Math.round(box.bottom) + ' vs ' + Math.round(layerBox.top) + '..' +
        Math.round(bandTop) + ')' + at);
      need(el.scrollWidth <= el.clientWidth + 1,
        name + ' overflows its box horizontally (' + el.scrollWidth + ' > ' +
        el.clientWidth + ')' + at);
      need(el.scrollHeight <= el.clientHeight + 1,
        name + ' overflows its box vertically (' + el.scrollHeight + ' > ' +
        el.clientHeight + ')' + at);
    }
    fits(panel, '#care-secret');
    for (var k = 0; k < rows.length; k++) fits(rows[k], 'feed row ' + k);
    var roster = doc.getElementById('care-roster');
    if (roster) fits(roster, '#care-roster');

    // The plates must still read PARENT 41 / CHILD 41 at 360 px, and the
    // shipped @media (max-width: 640px) rules are the ones deciding it -- which
    // is why this runs in an iframe with its own viewport.
    ['parent', 'child'].forEach(function (team) {
      var num = doc.getElementById('lives-' + team);
      var name = doc.getElementById('name-' + team);
      need(num && num.textContent === '41', team + ' plate lost its score' + at);
      need(name && rectOf(name).width > 0, team + ' plate name collapsed' + at);
      var sub = doc.querySelector('.plate[data-team="' + team + '"] .plate-sub');
      need(sub, team + ' plate has no subline element' + at);
      var shown = win.getComputedStyle(sub).display !== 'none';
      need(shown === (width > 640),
        team + ' plate subline is ' + (shown ? 'shown' : 'hidden') + at +
        ' — the shipped @media (max-width: 640px) rule did not decide it');
    });

    // The clock is spelled out at every width, never T12 (design note ## Viewer).
    var clock = doc.getElementById('clock-time');
    need(clock && clock.textContent === 'TURN 12 / ' + TURNS,
      'the clock reads ' + (clock ? clock.textContent : '(missing)') + at);

    // Evidence for the reviewer: the measured geometry of the boxes that carry
    // model text. viewer_smoke.mjs records the console into viewer-smoke.json.
    var widest = null;
    for (var r = 0; r < rows.length; r++) {
      var box = rectOf(rows[r]);
      if (!widest || box.width > widest.width) widest = box;
    }
    var panelBox = rectOf(panel);
    console.log('fixture ' + width + 'px: widest feed row ' +
      Math.round(widest.width) + 'px at x ' + Math.round(widest.left) + '..' +
      Math.round(widest.right) + ' (font ' +
      win.getComputedStyle(rows[0]).fontSize + '), secret panel ' +
      Math.round(panelBox.width) + 'x' + Math.round(panelBox.height) + ' at x ' +
      Math.round(panelBox.left) + '..' + Math.round(panelBox.right) +
      ', board region ' + Math.round(layerBox.top) + '..' +
      Math.round(bandTop) + ', ' + rows.length + ' feed rows, ' +
      tape.children.length + ' chips');
    return rows.length;
  }

  // ---- drive: one ingest per viewport width -----------------------------
  // Measure only once the frame has SETTLED: the shipped `.feed-row` slides in
  // from translateX(+30 * --u) over 250 ms, and a row measured mid-slide is
  // legitimately outside the frame (checklist item 15's entrance-animation
  // caveat), while a row measured before `font.ttf` arrives is measured in the
  // wrong font. Both made this fixture's numbers depend on the machine.
  var SETTLE_MS = 500;               // > the 250 ms feedin, < careFeed's 3200 ms dwell
  function settle(win, doc, next) {
    var fonts = doc.fonts && doc.fonts.ready ? doc.fonts.ready : null;
    var go = function () {
      setTimeout(function () {
        win.requestAnimationFrame(function () {
          win.requestAnimationFrame(next);
        });
      }, SETTLE_MS);
    };
    if (fonts) fonts.then(go, go); else go();
  }

  function step(index) {
    if (index >= VIEWS.length) {
      document.documentElement.setAttribute('data-replay-loaded', 'true');
      statusEl.textContent = 'fixture ok: the shipped page at ' +
        done.join(' / ') + ' px viewports, hunch ' + HUNCH_CAP +
        ' runes on both seats, notes ' + NOTES_CAP + ' runes, ' + TURNS +
        ' chips';
      return;
    }
    var width = VIEWS[index][0];
    var height = VIEWS[index][1];
    frame.width = width;
    frame.height = height;
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
    var win = frame.contentWindow;
    var doc = frame.contentDocument;
    need(win.__fixtureCore, 'the shipped page never created its core');
    // A fresh tick per width so the page's own event de-dup re-draws the feed.
    var state = buildState(700 + index);
    win.__fixtureCore.setViewportSize(width, height, 1);
    win.__fixtureCore.ingest(buildPacket(win, JSON.stringify(state)));
    settle(win, doc, function () {
      try {
        measure(win, doc, width);
      } catch (error) {
        fail(error && error.message ? error.message : String(error));
      }
      done.push(width);
      statusEl.textContent = 'fixture: ' + done.join(' / ') + ' px ok';
      step(index + 1);
    });
  }

  fetch(PAGE).then(function (response) {
    if (!response.ok) fail('the shipped page did not load: ' + response.status);
    return response.text();
  }).then(function (html) {
    var spliced = splice(html);
    frame.addEventListener('load', function () {
      try {
        var win = frame.contentWindow;
        need(win.ChromeCommon, 'chrome_common.js did not load into the frame');
        need(win.BroadcastCore, 'broadcast_core.js did not load into the frame');
        step(0);
      } catch (error) {
        fail(error && error.message ? error.message : String(error));
      }
    });
    frame.srcdoc = spliced;
  }).catch(function (error) {
    fail(error && error.message ? error.message : String(error));
  });
})();
</script>
</body>
</html>
